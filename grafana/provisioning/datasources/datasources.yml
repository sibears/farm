apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: flags
    user: grafana_ro
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    # Password comes from the GF_RO_PASSWORD env var (set in docker-compose.full.yml
    # from .env) — never a literal in this file.
    secureJsonData:
      password: ${GF_RO_PASSWORD}
